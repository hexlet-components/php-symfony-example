security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: auth_login
                check_path: auth_login
                enable_csrf: true
                default_target_path: event_index
            logout:
                path: auth_logout
                target: event_index
                enable_csrf: true
    access_control:
        - { path: '^/events/new$', roles: ROLE_USER }
        - { path: '^/events/\d+/(edit|delete)$', roles: ROLE_USER }
when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
